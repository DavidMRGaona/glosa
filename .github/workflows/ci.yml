name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck 0.11.0 (the version used in development)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sc.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: shellcheck --version && make lint

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install bats-core bash
      - name: Test with /bin/bash (3.2) and Homebrew bash (5.x)
        run: make test-all

  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git clone --depth 1 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
      - name: Test with the system bash (5.x)
        run: PATH="$RUNNER_TEMP/bats/bin:$PATH" make test
      - name: Test with bash 3.2
        run: |
          docker run --rm -v "$PWD:/src" -v "$RUNNER_TEMP/bats:/bats" -w /src bash:3.2 \
            bash -c 'bash --version | head -1 && /bats/bin/bats test'
